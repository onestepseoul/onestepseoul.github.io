<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>probe</title></head>
<body>
<pre id="out">running…</pre>
<script>
var URL = "https://script.google.com/macros/s/AKfycbw_dz50eWmabML1CP5GS18ofo12mbs9ViYdOcRKxhpl4OcGg8WNiHbUhM2tvhYM9hHH/exec";
var log = [];
function w(s){ log.push(s); document.getElementById("out").textContent = log.join("\n"); }
var params = new URLSearchParams();
params.set("type","support"); params.set("code","PROBE-CORS");
params.set("name","[자동점검]cors"); params.set("phone","010-0000-0000");
params.set("store","probe"); params.set("marketingAgree","N");
params.set("pageUrl", location.href);
var t0 = performance.now();
fetch(URL, { method:"POST", body: params })
  .then(function(r){
    w("cors status=" + r.status + " type=" + r.type + " at " + Math.round(performance.now()-t0) + "ms");
    return r.text();
  })
  .then(function(t){ w("body=" + t.slice(0,200)); w("total=" + Math.round(performance.now()-t0) + "ms"); })
  .catch(function(e){ w("cors FAILED at " + Math.round(performance.now()-t0) + "ms: " + e); });
</script>
</body></html>
